<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Résultat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page shell">
      <section class="card hero">
        <p class="eyebrow">Petit mot final</p>
        <h1 id="resultTitle">Ton message arrive...</h1>
        <p id="resultText" class="lead"></p>

        <div class="result-box">
          <span class="label">Réponse choisie</span>
          <strong id="resultAnswer">Aucune réponse enregistrée</strong>
        </div>

        <div class="result-box">
          <span class="label">Date choisie</span>
          <strong id="resultDate">Aucune date enregistrée</strong>
        </div>

        <div class="result-box">
          <span class="label">Heure choisie</span>
          <strong id="resultTime">Aucune heure enregistrée</strong>
        </div>

        <div class="result-box">
          <span class="label">Lieu choisi</span>
          <strong id="resultLocation">Aucun lieu enregistré</strong>
        </div>

        <form class="stack-form" id="resultSubmitForm">
          <div class="actions">
            <button class="button" type="submit">Envoyer</button>
            <a class="link" href="step2.html">Précédent</a>
          </div>
          <p class="hint" id="resultSubmitStatus"></p>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
