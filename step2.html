<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Où ?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="page shell">
      <section class="card hero">
        <p class="eyebrow">Où ?</p>
        <h1>Choisis le lieu.</h1>
        <form class="stack-form" id="locationForm">
          <label class="field" for="locationSelect">
            Lieu du rendez-vous
            <select class="select-input" id="locationSelect" name="locationSelect" required>
              <option value="" selected disabled>Choisis un lieu</option>
              <option value="Chez toi">Chez toi</option>
              <option value="Chez moi">Chez moi</option>
              <option value="autre">Autre</option>
            </select>
          </label>

          <label class="field is-hidden" id="customLocationField" for="customLocationInput">
            <br />
            Mais où alors ? 😶
            <input class="text-input" type="text" id="customLocationInput" name="customLocationInput" />
          </label>

          <div class="actions">
            <button class="button" type="submit">Suivant</button>
            <a class="link" href="step1.html">Précédent</a>
          </div>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
