<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini choix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page shell">
      <section class="card hero">
        <div id="authGate" class="auth-gate">
          <p class="eyebrow">Accès privé</p>
          <p class="lead">Ce petit site est privé, le mot de passe est là où on s'est rencontré.</p>

          <form class="stack-form" id="passwordForm">
            <label class="field" for="passwordInput">
              Mot de passe
              <input class="text-input password-input" type="password" id="passwordInput" name="passwordInput" autocomplete="current-password" required />
            </label>

            <div class="actions">
              <button class="button" type="submit">Entrer</button>
            </div>
          </form>

          <p class="hint" id="passwordHint">Le mot de passe est demandé avant d’afficher la suite.</p>
        </div>

        <div id="siteContent" class="site-content is-hidden">
          <p class="eyebrow">Une petite question</p>
          <h1>Est-ce que tu veux qu’on se voit :o ?</h1>
          <form class="stack-form" id="choiceForm">
            <div class="choices">
              <button class="choice yes" data-answer="oui" name="answer" value="oui" type="submit">Oui</button>
              <button class="choice no" data-answer="non" name="answer" value="non" type="submit">Non</button>
            </div>
          </form>

        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
