<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini choix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page shell">
      <section class="card hero">
        <p class="eyebrow">Une petite question</p>
        <h1>Est-ce que tu veux qu’on se voit ?</h1>
        <p class="lead">Je te propose un petit date tout doux. Choisis oui ou non, puis la suite t’emmène vers le message final.</p>

        <div class="choices">
          <button class="choice yes" data-answer="oui" type="button">Oui</button>
          <button class="choice no" data-answer="non" type="button">Non</button>
        </div>

        <p class="hint">Promis, c’est simple, léger et sans pression.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
